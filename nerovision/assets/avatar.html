<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>NeroVision Avatar</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
canvas { display:block; width:100%; height:100%; }
#status-dot {
  position:fixed; top:8px; right:8px; width:10px; height:10px;
  border-radius:50%; background:#666; z-index:10; transition:background .3s;
}
#status-dot.connected { background:#44FF88; }
</style>
</head>
<body>
<div id="status-dot"></div>
<canvas id="c"></canvas>
<script>
(function() {
"use strict";

// ── Constants ────────────────────────────────────────────────────

var COLORS = {
  IDLE:      "#4488FF",
  LISTENING: "#44FF88",
  THINKING:  "#FFAA44",
  SPEAKING:  "#AA44FF",
  ERROR:     "#FF4444"
};

var MAX_PARTICLES = 40;
var WS_URL = "ws://127.0.0.1:9090";
var WS_RECONNECT_MS = 3000;

// ── State ────────────────────────────────────────────────────────

var currentState = "IDLE";
var phase = 0;
var particles = [];
var ws = null;
var wsConnected = false;

// ── Canvas setup (DPR-aware) ─────────────────────────────────────

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var dpr = window.devicePixelRatio || 1;
var W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ── Color helpers ────────────────────────────────────────────────

function hexToRgb(hex) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  return [r, g, b];
}

function rgba(hex, a) {
  var c = hexToRgb(hex);
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
}

function stateColor() {
  return COLORS[currentState] || COLORS.IDLE;
}

// ── Particle system ──────────────────────────────────────────────

function spawnParticles(cx, cy) {
  var count = 10 + Math.floor(Math.random() * 6);
  for (var i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
    particles.push({
      x: cx + (Math.random() - 0.5) * 30,
      y: cy + (Math.random() - 0.5) * 30,
      vx: (Math.random() - 0.5) * 2,
      vy: -(Math.random() * 2 + 0.5),
      alpha: 1,
      radius: Math.random() * 4 + 2,
      color: stateColor()
    });
  }
}

function updateParticles() {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.02;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = rgba(p.color, p.alpha);
    ctx.fill();
  }
}

// ── Hexagon core ─────────────────────────────────────────────────

function drawHexagon(cx, cy, r, fill, strokeCol, strokeW) {
  ctx.beginPath();
  for (var i = 0; i < 6; i++) {
    var angle = Math.PI / 3 * i - Math.PI / 2;
    var x = cx + r * Math.cos(angle);
    var y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (strokeCol) {
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = strokeW || 2;
    ctx.stroke();
  }
}

// ── State animations ─────────────────────────────────────────────

function drawIdle(cx, cy, r) {
  var scale = 0.95 + 0.05 * Math.sin(phase * 0.7);
  var sr = r * scale;
  drawHexagon(cx, cy, sr, rgba(stateColor(), 0.7), stateColor(), 3);

  ctx.beginPath();
  ctx.arc(cx, cy, sr * 1.15, 0, Math.PI * 2);
  ctx.strokeStyle = rgba(stateColor(), 0.15 + 0.1 * Math.sin(phase * 0.7));
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawListening(cx, cy, r) {
  drawHexagon(cx, cy, r * 0.4, rgba(stateColor(), 0.5), stateColor(), 2);

  for (var i = 0; i < 3; i++) {
    var rp = (phase * 0.5 + i * 2.1) % (Math.PI * 2);
    var rippleR = r * 0.4 + r * 0.7 * (rp / (Math.PI * 2));
    var alpha = 1 - rp / (Math.PI * 2);
    if (alpha <= 0) continue;
    ctx.beginPath();
    ctx.arc(cx, cy, rippleR, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(stateColor(), alpha * 0.8);
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }
}

function drawThinking(cx, cy, r) {
  drawHexagon(cx, cy, r * 0.35, rgba(stateColor(), 0.3), null, 0);

  var speed = 3 + Math.sin(phase * 0.3) * 1.5;
  var startAngle = phase * speed;
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle, startAngle + 1.75);
  ctx.strokeStyle = stateColor();
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle + Math.PI, startAngle + Math.PI + 1.05);
  ctx.stroke();
  ctx.lineCap = "butt";
}

function drawSpeaking(cx, cy, r) {
  var barW = r * 0.22;
  var gap = r * 0.12;
  var total = 5 * barW + 4 * gap;
  var startX = cx - total / 2;

  for (var i = 0; i < 5; i++) {
    var bp = phase * 1.2 + i * 0.7;
    var h = r * 0.3 + r * 0.7 * Math.abs(Math.sin(bp));
    var x = startX + i * (barW + gap);
    var top = cy - h / 2;
    var alpha = 0.7 + 0.3 * Math.abs(Math.sin(bp));
    ctx.fillStyle = rgba(stateColor(), alpha);
    roundRect(x, top, barW, h, barW / 2);
  }
}

function drawError(cx, cy, r) {
  var pulse = 0.8 + 0.2 * Math.sin(phase * 3);
  var flash = Math.sin(phase * 5) > 0 ? 1 : 0.6;

  ctx.beginPath();
  ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
  ctx.fillStyle = rgba(stateColor(), 0.15 * pulse);
  ctx.fill();

  var arm = r * 0.35 * pulse;
  ctx.strokeStyle = rgba(stateColor(), flash);
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx - arm, cy - arm);
  ctx.lineTo(cx + arm, cy + arm);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + arm, cy - arm);
  ctx.lineTo(cx - arm, cy + arm);
  ctx.stroke();
  ctx.lineCap = "butt";
}

function roundRect(x, y, w, h, rad) {
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.lineTo(x + w - rad, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
  ctx.lineTo(x + w, y + h - rad);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  ctx.lineTo(x + rad, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
  ctx.lineTo(x, y + rad);
  ctx.quadraticCurveTo(x, y, x + rad, y);
  ctx.closePath();
  ctx.fill();
}

// ── Orbital particles ────────────────────────────────────────────

var orbitals = [];
for (var i = 0; i < 6; i++) {
  orbitals.push({
    angle: (Math.PI * 2 / 6) * i,
    speed: 0.3 + Math.random() * 0.4,
    dist: 0.8 + Math.random() * 0.3,
    size: 2 + Math.random() * 3
  });
}

function drawOrbitals(cx, cy, r) {
  for (var i = 0; i < orbitals.length; i++) {
    var o = orbitals[i];
    var a = o.angle + phase * o.speed;
    var d = r * o.dist;
    var x = cx + d * Math.cos(a);
    var y = cy + d * Math.sin(a);
    ctx.beginPath();
    ctx.arc(x, y, o.size, 0, Math.PI * 2);
    ctx.fillStyle = rgba(stateColor(), 0.5 + 0.3 * Math.sin(phase + i));
    ctx.fill();
  }
}

// ── Main render loop ─────────────────────────────────────────────

var drawFn = {
  IDLE: drawIdle,
  LISTENING: drawListening,
  THINKING: drawThinking,
  SPEAKING: drawSpeaking,
  ERROR: drawError
};

function frame() {
  phase += 0.04;
  updateParticles();

  ctx.clearRect(0, 0, W, H);

  var cx = W / 2;
  var cy = H / 2;
  var r = Math.min(W, H) * 0.3;

  drawParticles();
  drawOrbitals(cx, cy, r * 1.3);

  var fn = drawFn[currentState] || drawIdle;
  fn(cx, cy, r);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── State API ────────────────────────────────────────────────────

var prevState = currentState;

function setState(name) {
  var upper = (name || "").toUpperCase();
  if (!COLORS[upper]) return;
  if (upper === currentState) return;
  prevState = currentState;
  currentState = upper;
  spawnParticles(W / 2, H / 2);
}

window.setAvatarState = setState;
window.getAvatarState = function() { return currentState; };

// ── WebSocket bridge ─────────────────────────────────────────────

var dot = document.getElementById("status-dot");

function connectWS() {
  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    scheduleReconnect();
    return;
  }

  ws.onopen = function() {
    wsConnected = true;
    dot.classList.add("connected");
  };

  ws.onmessage = function(ev) {
    try {
      var msg = JSON.parse(ev.data);
      if (msg.state) setState(msg.state);
    } catch (_) {}
  };

  ws.onclose = function() {
    wsConnected = false;
    dot.classList.remove("connected");
    scheduleReconnect();
  };

  ws.onerror = function() {
    wsConnected = false;
    dot.classList.remove("connected");
    try { ws.close(); } catch (_) {}
  };
}

function scheduleReconnect() {
  setTimeout(connectWS, WS_RECONNECT_MS);
}

connectWS();

})();
</script>
</body>
</html>
